<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazón "Te Quiero" Multilingüe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #060208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            box-shadow: 0 0 50px rgba(230, 26, 41, 0.15);
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");

        const width = 800;
        const height = 800;
        canvas.width = width;
        canvas.height = height;

        const SC = 21;
        const OY = 20;
        const DURATION = 10;
        const TICK = 16;
        const ANIM = 42;
        const LIFT = 34;
        const GAP = 12; // Espacio ampliado para evitar solapamientos
        const SIZES = [8, 9, 10]; // Tamaños ajustados para mejor distribución
        const FONT = "Arial";
        const BG = "#060208";

        let seed = 11;
        function random() {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function uniform(min, max) {
            return min + random() * (max - min);
        }

        function choice(arr) {
            return arr[Math.floor(random() * arr.length)];
        }

        // Gran lista de expresiones de afecto sin repetir (excluyendo "Te quiero" del ciclo general)
        const PHRASES = [
            "I love you", "Je t'aime", "Ich liebe dich", "Ti amo", "Eu te amo",
            "Я тебя люблю", "Seni seviyorum", "사랑해", "愛してる", "我爱你",
            "मैं तुमसे प्यार करता हूँ", "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig",
            "Kocham cię", "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю",
            "Mahal kita", "T'estimo", "Maite zaitut", "Te amo", "Volim te",
            "Milujem ťa", "Szeretlek", "Te iubesc", "Obicham te", "Jeg elsker dig",
            "Minä rakastan sinua", "Eg elsker deg", "Aloha wau ia oe", "Mahal kita",
            "Wa i love you", "Ndinokuda", "Nimekupenda", "Mina ikutan", "Ana uhibbuka",
            "Ani ohev otach", "Ghajriek", "Te dua", "Rad the chao", "Amo-te"
        ];

        function heart(a) {
            const x = 16 * Math.pow(Math.sin(a), 3);
            const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
            return [x * SC, y * SC + OY];
        }

        function hx(c) {
            const r = Math.round(Math.max(0, Math.min(1, c[0])) * 255);
            const g = Math.round(Math.max(0, Math.min(1, c[1])) * 255);
            const b = Math.round(Math.max(0, Math.min(1, c[2])) * 255);
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        function mix(a, b, k) {
            return [
                a[0] + (b[0] - a[0]) * k,
                a[1] + (b[1] - a[1]) * k,
                a[2] + (b[2] - a[2]) * k
            ];
        }

        function dim(c, k) {
            return [c[0] * k, c[1] * k, c[2] * k];
        }

        const POLY = [];
        for (let i = 0; i < 720; i++) {
            POLY.push(heart(2 * Math.PI * i / 720));
        }

        const EDGES = [];
        for (let i = 0; i < POLY.length; i++) {
            EDGES.push([POLY[i], POLY[(i + 1) % POLY.length]]);
        }

        const YMAX = Math.max(...POLY.map(p => p[1]));
        const YMIN = Math.min(...POLY.map(p => p[1]));
        const CY = (YMAX + YMIN) / 2;

        function spans(y) {
            let xs = [];
            for (let [p1, p2] of EDGES) {
                let [x1, y1] = p1;
                let [x2, y2] = p2;
                if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
                    xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
                }
            }
            xs.sort((a, b) => a - b);
            let result = [];
            for (let i = 0; i < xs.length; i += 2) {
                if (i + 1 < xs.length) {
                    result.push([xs[i], xs[i + 1]]);
                }
            }
            return result;
        }

        function intersect(A, B) {
            let out = [];
            for (let a of A) {
                for (let b of B) {
                    let lo = Math.max(a[0], b[0]);
                    let hi = Math.min(a[1], b[1]);
                    if (hi - lo > 14) {
                        out.push([lo, hi]);
                    }
                }
            }
            return out;
        }

        function measureText(text, size) {
            ctx.font = `bold ${size}px ${FONT}`;
            return ctx.measureText(text).width;
        }

        function math_dist(x, y) {
            return Math.hypot(x / (16 * SC), (y - CY) / (14.5 * SC));
        }

        function build() {
            let row_h = 20; // Filas más espaciadas para evitar superposición vertical
            let half = row_h / 2;
            let placed = [];

            // Barajar la lista de frases para que no se repitan de forma secuencial
            let availablePhrases = [...PHRASES];
            for (let i = availablePhrases.length - 1; i > 0; i--) {
                const j = Math.floor(random() * (i + 1));
                [availablePhrases[i], availablePhrases[j]] = [availablePhrases[j], availablePhrases[i]];
            }
            let phraseIndex = 0;

            let y = YMAX - half;

            while (y > YMIN + half) {
                let row = intersect(spans(y + half), spans(y - half));

                for (let [lo, hi] of row) {
                    lo += 6;
                    hi -= 6;
                    let cur = lo + uniform(0, 8);
                    let line = [];

                    while (true) {
                        let fit = null;
                        for (let i = 0; i < 10; i++) {
                            // Si se acaban las frases únicas, se vuelve a barajar otra lista única
                            if (phraseIndex >= availablePhrases.length) {
                                availablePhrases = [...PHRASES];
                                for (let k = availablePhrases.length - 1; k > 0; k--) {
                                    const j = Math.floor(random() * (k + 1));
                                    [availablePhrases[k], availablePhrases[j]] = [availablePhrases[j], availablePhrases[k]];
                                }
                                phraseIndex = 0;
                            }
                            let text = availablePhrases[phraseIndex++];
                            let size = choice(SIZES);
                            let w = measureText(text, size);
                            
                            if (cur + w <= hi) {
                                fit = [text, size, w];
                                break;
                            }
                        }
                        if (!fit) break;
                        let [text, size, w] = fit;
                        line.push([cur + w / 2, text, size, w]);
                        cur += w + GAP;
                    }

                    if (line.length === 0) continue;

                    if (line.length > 1) {
                        let left = hi - (line[line.length - 1][0] + line[line.length - 1][3] / 2);
                        for (let i = 0; i < line.length; i++) {
                            line[i][0] += left * i / (line.length - 1);
                        }
                    } else {
                        line[0][0] = (lo + hi) / 2;
                    }

                    for (let i = 0; i < line.length; i++) {
                        let [x, text, size, w] = line[i];
                        let edge = (i === 0 || i === line.length - 1);
                        placed.push({ x: x, y: y, text: text, size: size, edge: edge });
                    }
                }
                y -= row_h;
            }

            // Encontrar el elemento más cercano al centro absoluto del corazón
            let centerItem = null;
            let minDistance = Infinity;
            for (let p of placed) {
                let d = Math.hypot(p.x, p.y - CY);
                if (d < minDistance) {
                    minDistance = d;
                    centerItem = p;
                }
            }

            // Forzar que el centro exacto sea "Te quiero" en español con relieve y tamaño destacado
            if (centerItem) {
                centerItem.text = "Te quiero";
                centerItem.size = 14;
            }

            const wine = [0.58, 0.0, 0.09];
            const crimson = [0.90, 0.05, 0.14];
            const blood = [0.98, 0.10, 0.16];

            for (let p of placed) {
                let rad = Math.min(1.0, math_dist(p.x, p.y));
                let base = mix(wine, crimson, 0.25 + 0.75 * rad);
                base = mix(base, blood, uniform(0, 0.35) + (p.edge ? 0.3 : 0));
                p.color = [Math.min(1, base[0]), Math.min(1, base[1]), Math.min(1, base[2])];
                p.rad = rad;
            }

            let edges = placed.filter(p => p.edge);
            let inner = placed.filter(p => !p.edge);

            edges.sort((a, b) => {
                let angA = (Math.atan2(a.x, a.y - CY) % (2 * Math.PI));
                let angB = (Math.atan2(b.x, b.y - CY) % (2 * Math.PI));
                return angA - angB;
            });

            inner.sort((a, b) => (-a.rad + uniform(0, 0.08)) - (-b.rad + uniform(0, 0.08)));

            return edges.concat(inner);
        }

        const FLASH = [1.0, 0.78, 0.78];
        const BGC = [0.023, 0.008, 0.031];

        let main_ids = [];
        let active = [];
        let ORDER = build();
        let itemsIndex = 0;
        let RATE = ORDER.length / (DURATION * 1000 / TICK);
        let acc = 0.0;
        let spawning = true;

        function clamp(v) {
            return Math.max(0.0, Math.min(1.0, v));
        }

        function spawn(p) {
            p.cx = p.x + width / 2;
            p.cy = -p.y + height / 2;
            p.f = 0;
            p.dx = uniform(-10, 10);
            main_ids.push(p);
            active.push(p);
        }

        function math_sin(v) {
            return Math.sin(Math.PI * v);
        }

        function animate(p) {
            p.f += 1;
            let u = clamp(p.f / ANIM);
            let e = 1 - Math.pow(1 - u, 3);
            let c = p.color;
            let x = p.cx;
            let y = p.cy;
            let hover = (1 - e) * LIFT;
            let px = x + p.dx * (1 - e);
            let py = y - hover;

            // Sombra
            ctx.font = `bold ${p.size}px ${FONT}`;
            ctx.fillStyle = hx(mix(BGC, dim(c, 0.30), e));
            ctx.fillText(p.text, px + 2, py + 3 + LIFT);

            // Halo / Resplandor
            ctx.font = `bold ${p.size + 1}px ${FONT}`;
            ctx.fillStyle = hx(mix(BGC, dim(c, 0.20), e * e));
            ctx.fillText(p.text, px, py + LIFT);

            // Texto Principal
            let flash = 0.75 * math_sin(clamp((u - 0.55) / 0.45));
            let col = mix(mix(BGC, c, Math.pow(e, 1.5)), FLASH, flash);
            ctx.font = `bold ${p.size}px ${FONT}`;
            ctx.fillStyle = hx(col);
            ctx.fillText(p.text, px, py);

            if (u >= 1) {
                p.currentColor = c;
                return false;
            }
            return true;
        }

        function drawSettled(p) {
            ctx.font = `bold ${p.size}px ${FONT}`;
            ctx.fillStyle = hx(p.currentColor || p.color);
            ctx.fillText(p.text, p.cx, p.cy);
        }

        let shimmerTimer = 0;
        function shimmer() {
            if (main_ids.length > 0) {
                let target = main_ids[Math.floor(Math.random() * main_ids.length)];
                target.currentColor = mix(target.color, FLASH, 0.6);
                setTimeout(() => {
                    target.currentColor = target.color;
                }, 260);
            }
        }

        function step() {
            ctx.fillStyle = BG;
            ctx.fillRect(0, 0, width, height);

            if (spawning) {
                acc += RATE;
                while (acc >= 1 && itemsIndex < ORDER.length) {
                    acc -= 1;
                    spawn(ORDER[itemsIndex++]);
                }
                if (itemsIndex >= ORDER.length) {
                    spawning = false;
                }
            }

            for (let p of main_ids) {
                if (!active.includes(p)) {
                    drawSettled(p);
                }
            }

            active = active.filter(p => animate(p));

            if (!spawning && active.length === 0) {
                shimmerTimer++;
                if (shimmerTimer % 9 === 0) {
                    shimmer();
                }
            }

            setTimeout(step, TICK);
        }

        setTimeout(() => {
            step();
        }, 200);
    </script>
</body>
</html>
